<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4eee3">
  <meta name="description" content="A small, installable Hello World app.">
  <meta name="apple-mobile-web-app-title" content="Hello">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <title>Hello</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f4eee3; color: #27312a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    main { max-width: 380px; text-align: center; }
    img { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 24px; }
    h1 { font: 400 44px/1.1 Georgia, serif; letter-spacing: -2px; margin: 0 0 14px; }
    p { color: #73796f; font-size: 15px; line-height: 1.6; }
    #status { margin-top: 32px; font-size: 12px; }
    button { border: none; padding: 14px 24px; border-radius: 12px; background: #526854; color: white; font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img src="./icon-192.png" alt="">
    <h1>Hello world.</h1>
    <p>A little app, ready to take with you.</p>
    <button id="install" hidden>Install app</button>
    <p id="status" role="status">Checking offline support…</p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
